                   CYS_PACK_DIR="$(mktemp -d)" CYS_STATE_DIR="$(mktemp -d)" \
                   JAVIS_ROOT="$(mktemp -d)" python3 "$f" > "/tmp/wp7-$t.log" 2>&1
            then r=0; else r=$?; fi
            tail -60 "/tmp/wp7-$t.log"
            [ $r -eq 0 ] || { echo "::error::$t rc=$r (WP-7 자원 게이트 회귀)"; rc=$r; }
          done
          g="cysjavis-pack/bin/javis_resource_gate.py"
          [ -f "$g" ] || { echo "게이트 누락: $g (git add 누락 의심)" >&2; exit 1; }
          echo "== javis_resource_gate --self-test =="
          if env -u CYS_SOCKET -u CYS_GATE_LANE_SOCKET -u CYS_ROLE \
                 CYS_PACK_DIR="$(mktemp -d)" CYS_STATE_DIR="$(mktemp -d)" \
                 python3 "$g" --self-test > /tmp/wp7-selftest.log 2>&1
          then r=0; else r=$?; fi
          tail -20 /tmp/wp7-selftest.log
          [ $r -eq 0 ] || { echo "::error::javis_resource_gate --self-test rc=$r"; rc=$r; }
          exit $rc

