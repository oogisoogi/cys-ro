      # ★WP-7 R3(0.14.31 · 독립 재유도 지적 2·5): **안 도는 검체는 게이트가 아니다** 의 재발.
      #   `cysjavis-pack/tests/` → `cysjavis-pack/bin/tests/` 이동은 됐는데 등재가 없어
      #   test_resource_gate·test_resource_gate_fleet_cpu·test_inject_context_role_seat 세 스위트와
      #   `javis_resource_gate.py --self-test` 가 **3레인 전부에서 0회 실행**이었다. 그 사각 안에
      #   WP-7 이 R1·R2·R3 에서 고친 것들(함대CPU 소유권·보류 상한 래치·부트 유예·역할 좌석 강등)의
      #   핀이 전부 들어 있다 — 다음 회귀는 초록으로 지나간다.
      #   ★기존 목록에 이름만 덧붙이지 않고 **전용 스텝**으로 둔 이유(codex): 같은 꼬리 줄을 여러
      #     레인 워커가 동시에 고치면 통합에서 충돌한다. 스텝 단위면 삽입 지점이 서로 다르다.
      #   ★밀폐: 검체마다 임시 CYS_PACK_DIR·CYS_STATE_DIR·JAVIS_ROOT + 소켓/역할/soul env 제거
      #     (`env -u`). 라이브 데몬·오너 홈 무접촉 — 훅 검체는 자기 HOME 도 임시로 고정한다.
      #   ★`if:` 를 달지 않는다(돌지 않는 초록 금지) · 파일 부재와 비정상 종료는 그대로 실패다.
      #   실측(로컬): 네 검체 합 약 1.6s + self-test 0.2s.
      - name: 팩 검체 — 자원 게이트·함대CPU·역할 좌석 (WP-7 R3 3레인 등재 · pack-only 서명전)
        shell: bash
        run: |
          set -u
          # ★R2(수렴 · 리뷰 minor): GitHub 의 `shell: bash` 는 `bash --noprofile --norc -eo pipefail`
          #   이다 — `-e` 때문에 **첫 실패 검체에서 스텝이 즉시 끝난다**: `r=$?` · `tail` 로그 꼬리 ·
          #   `::error::` 주석 · 나머지 검체 · 마지막 `exit $rc` 집계가 하나도 실행되지 않는다.
          #   레인은 여전히 적색(fail-closed)이지만 이 스텝이 존재하는 이유인 **진단**이 사라진다.
          #   `if <명령>; then …; else r=$?; fi` 는 그 명령에 한해 `-e` 를 끈다(POSIX 셸 규약).
          rc=0
          for t in test_resource_gate test_resource_gate_fleet_cpu \
                   test_inject_context_role_seat test_wp7_gate_triage; do
            f="cysjavis-pack/bin/tests/$t.py"
