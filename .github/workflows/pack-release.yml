# ── 팩-only 릴리스 레인 (2026-07-13 오너 승인 — "인테리어만 교체") ──
# 본체(바이너리) 버전 범프 없이 팩 콘텐츠만 전진시킨다. 사용자 GUI는 본체 알림 없이
# 팩 무중단(↻·세션/데몬 생존) 경로만 보게 된다.
#
# 사용법: 팩만 변경됐는지 scripts/release-lane-check.sh로 판별 후
#   git tag pack-vX.Y.Z && git push origin pack-vX.Y.Z
# 버전 규칙(충돌 함정): pack-vX.Y.Z 는 직전 pack_version(본체 결합값 포함)보다 커야 하고,
#   이후 '본체' 릴리스의 다음 버전은 반드시 최신 pack-v 버전보다 커야 한다(동일 pack_version
#   재사용 시 갱신 감지 무음 실패 — lane-check가 기계 검사).
#
# 게이트·산출물은 release.yml pack-artifacts 잡과 동형(시크릿 2중 스캔·역커버리지·동일성 3자
# 폐포·실서명→실검증). 차이는 ①pack_version을 태그에서 주입(--pack-version, 바이너리 버전과
# 분리) ②본체 자산 없이 팩 3종 + 직전 릴리스의 latest.json 캐리포워드(binary updater endpoint가
# releases/latest를 보므로, latest 마킹 후에도 본체 버전 감지가 끊기지 않게 유지).
name: pack-release

on:
  push:
    tags:
      - "pack-v*"

env:
  SRC_REPO: oogisoogi/cys-ro   # 2026-09-08 포크 전환(TICKET=cys-fork-rebase-v0.14.30)

# ★B1(1.1.9 · TICKET=cysr-119-defects): release.yml 과 같은 규칙 — 같은 ref 의 팩 릴리스 런은 한 번에 하나
#   (cancel-in-progress: false = 진행 런 보존 · 뒤 런 대기). 1.1.8 백로그 ⓒ(master#9306a99f).
concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-only:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEY_ID: 'C81BCA7B89578FDE'    # 임베드 키링(cysjavis-pack/trusted-keys.json) key_id — P2(1.0.1 팩 키 회전 · docs/KEY-ROTATION.md §4 · 종전 54FBA04AD0E0F49D)
      EXPIRES_DAYS: '90'            # 서명 신선도 유효창(release.yml과 동일)
      # ★min_binary는 정책 파생(해법③⑤ · 2026-07-14): scripts/min-binary-policy.sh가
      # max(security-floor.txt, 지원창 하한)을 계산 — 손설정 하한의 '잊음' 실패 계급 제거.
      #
      # ⚠**정책 스크립트가 모르는 것 = 기능 의존**(2026-07-26 S26 레인 비대칭 교정).
      #   min-binary-policy.sh 는 **보안 하한·지원창만** 계산한다. "이 팩이 새 바이너리 기능을
      #   요구하는가"는 그 입력에 아예 없다. 실측: `bash scripts/min-binary-policy.sh` → 0.12.48.
      #   그래서 **규칙**: 바이너리 릴리스가 새 CLI 표면(플래그·서브커맨드)을 추가하고 팩이 그것을
      #   **지시**하면, 다음 pack-v 태그 **전에** 아래 OVERRIDE 를 그 버전으로 올려라. 안 올리면
      #   구버전 바이너리 사용자가 팩을 받아 지시대로 실행했을 때 unknown-flag 로 죽는다.
      #   (같은 규칙의 본체 레인 대응물 = release.yml 의 `PACK_MIN_BINARY`. 두 레인은 **따로**
      #    고쳐야 한다 — 한쪽만 고치면 다른 문으로 같은 실패가 들어온다. 이게 S26 의 실제 사고다.)
      #
      # 현재 값 0.14.31 의 근거(2026-09-08 · CONTRACTS §B-10 · 통합 단계 마스터 집행): 이 세대 팩이
      #   **0.14.31 에 처음 생긴 CLI 표면의 실행을 직접 지시**한다 —
      #     · `cysjavis-pack/hooks/session-start.sh:94` → `cys reclaim-role --auto --config … --cwd …`
      #       (`:215` 는 `cys reclaim-role --auto --takeover-empty-seat` 를 사람에게 지시)
      #     · 팩 preflight `C82.gate-corpus-drift` → `cys gate-corpus --json`
      #     · 역할/승인 관문 → `cys approval sign --ttl` · `cys approval check --require-ttl`
      #     · 경보 라우팅 게이트 → `cys status --json` 의 최상위 `alert_route` 키
      #   부재 실측(2026-09-08 · v0.14.30 태그 대조):
      #     `git show v0.14.30:src/bin/cys.rs | grep -c reclaim-role` → 0
      #     `git show v0.14.30:src/bin/cys.rs | grep -c gate-corpus`  → 0
      #     `git show v0.14.30:cysjavis-pack/hooks/session-start.sh | grep -c reclaim-role` → 0
      #   즉 ≤0.14.30 바이너리 사용자가 이 팩을 받아 지시대로 실행하면 unknown-subcommand /
      #   unknown-flag 로 죽고 세션 시작 훅이 역할 없이 진행한다(기능 의존 — RELEASE.md 불변 규칙).
      #   release.yml PACK_MIN_BINARY 와 **같은 커밋에서 동시 상향**(두 값 동일 계약).
      #
      # 구 값 0.14.29 의 근거(이력 · 2026-08-31 · T5T6 R1-적대 차단 수리 · master 결재): 0.14.29 팩의
      #   pack-guard.sh 가 "이 수정은 보존됩니다(kept-drift)" 를 약속하는데, 그 거동(수정 system
      #   파일의 벤더 미전진 보존·전진 시 자동 3-way)은 0.14.29 바이너리에서 처음 생긴다 —
      #   ≤0.14.28 스윕은 종전대로 치유해 팩 자신의 약속이 거짓이 된다(기능 의존).
      #   release.yml PACK_MIN_BINARY 와 동시 상향 — 두 값 동일 계약(RELEASE.md).
      #
      # 구 값 0.14.2 의 근거(이력): v0.14.2 팩의 javis_orchestra.py 가 `cys todo-path --emit-decl`
      #   실행을 지시하는데 그 플래그는 이 레인에서 v0.14.2 에 처음 생긴다(≤0.14.1 에는 부재 —
      #   `git show v0.14.1:src/bin/cys.rs | grep -c emit_decl` → 0 으로 실측).
      #   상향 시 release.yml 의 PACK_MIN_BINARY 와 **같은 값인지** 확인할 것.
      #
      # 값 지정 시 정책이 무시되고 "min_binary 정책 오버라이드 사용" ::warning 이 로그에 남는다
      #   (아래 Compute min_binary 스텝) — 의도된 흔적이다. 근거를 커밋에 남길 것.
      # ★1.0.0 상향(2026-09-16 · TICKET=cys-v101-integrate · master#b39abd5c) — 팩 서명 키가 P2 로 바뀌었고
      #   P2 는 1.0.0 바이너리 키링에서 처음 신뢰된다(≤0.14.x 키링 = 옛 키만 → 서명 거부). 아래 하한 검증기도
      #   v$MIN_BINARY 로 빌드되므로 0.14.29 로 두면 발행이 막힌다. release.yml PACK_MIN_BINARY 와 동시 상향.
      # ★1.1.7 상향(2026-09-29 · TICKET=cysr-117-impl-input ③) — 새 팩 phoenix G2 가 1.1.7 신설 `reinject --check --ack-only`
      #   를 부른다. release.yml PACK_MIN_BINARY 와 동시 상향(두 값 동일 계약 · cys.rs 시험 핀).
      # ★1.1.8 편입(원작자 0.14.43 병합 · 2026-10-05) — 원작자 줄은 이 값을 0.14.41 · 0.14.42 로 올렸다(근거 =
      #   release.yml PACK_MIN_BINARY 주석). 우리 판번 줄(1.x)에서는 1.1.7 아래 값이라 그대로 들이지 않는다.
      #   1.1.8 상향 여부는 판번 SOT 단계 결정(병합 갈림 R2 · release.yml 과 동시).
      PACK_MIN_BINARY_OVERRIDE: '1.1.7'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # ★(0.14.31 통합 · CONTRACTS E-4 ② 확장 · 마스터 결정 2026-09-08) 이 잡의 python 을
      #   **3.12 로 고정**한다 — ci-branch.yml 잡1(:439)·잡2·windows-health.yml 과 같은 핀이다.
      #   왜: 이 잡의 팩 검체 스텝들은 러너 이미지 기본 python3 로 돌고 있었다. 즉 같은 스위트를
      #   레인마다 다른 인터프리터로 돌리고 있었고 그 차이는 **이미지가 갱신될 때 말없이 바뀐다**
      #   (0.14.31 신설 test_trust_seed 의 LiveProcess 군은 인터프리터에 따라 실행/정직skip 이
      #   갈린다 — 재현 가능한 전제가 없으면 '초록'이 무엇을 뜻하는지 알 수 없다).
      #   ⚠범위 한계(정직): 이것은 **러너 python 의 핀**이지 동봉 런타임의 핀이 아니다. 동봉
      #   python 은 prep-mac-runtime.sh 가 python-build-standalone 3.12.13 을 따로 내려받고
      #   precompile-bundled-python.sh 가 **동봉 인터프리터 자신**으로 컴파일한다(호스트 무관).
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Derive pack version from tag
        run: |
          set -euo pipefail
          PV="${GITHUB_REF_NAME#pack-v}"
          echo "$PV" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::태그가 pack-vX.Y.Z 형식이 아님: $GITHUB_REF_NAME"; exit 1; }
          echo "PACK_VERSION=$PV" >> "$GITHUB_ENV"
          echo "pack_version=$PV (tag $GITHUB_REF_NAME)"

      # ★해법③⑤: min_binary = max(security_floor, 지원창 하한) — 정책 공식(가시화 로그 포함).
      - name: Compute min_binary (policy)
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if [ -n "$PACK_MIN_BINARY_OVERRIDE" ]; then
            MB="$PACK_MIN_BINARY_OVERRIDE"
            echo "::warning::min_binary 정책 오버라이드 사용: $MB"
          else
            MB="$(bash scripts/min-binary-policy.sh)"
          fi
          echo "MIN_BINARY=$MB" >> "$GITHUB_ENV"
          echo "min_binary=$MB"

      # ★시크릿/개인정보 발행 hard-gate (release.yml과 동일 2중 스캔).
      - name: Secret/PII scan (pre-build hard-gate)
        run: bash scripts/secret-scan.sh --all

      # ★H-SECRET-1 — 스캐너가 **살아 있는가**를 증명하는 메타 게이트 (IG-2 · master 지시 2026-09-04).
      #   위 secret-scan.sh 는 트리가 깨끗하면 초록이다. 그런데 **스캐너가 죽어 있어도**(정규식
      #   파손·조기 exit 0·파일 목록 0건) 깨끗한 트리는 똑같이 초록이다 — 종료코드만 보는 게이트는
      #   자기 고장을 통과로 접는다. H-SECRET-1 은 규칙별 양성 표본을 임시 파일(저장소 밖)에 넣고
      #   **그 규칙 라벨로** 잡히는지까지 확인한다(라벨을 보는 이유: 아무 규칙이나 걸려도 exit 1 이라
      #   6종 중 5종이 죽어도 종료코드는 같다). 자기 면제 동결도 함께 본다.
      #   ★왜 지금 넣는가: 2026-09-04 팩 fixture 에 오너 핸들이 실제로 유출됐고(수리 011a6f6),
      #   그 계급을 잡는 규칙(handle→HANDLE)이 이 검체 안에 있다. 종전에 이 검체는 ci-branch
      #   잡2 에서만 돌았고 **발행 레인에는 0회** 였다 — "안 도는 검체는 게이트가 아니다".
      #   실측 22.1s(러너 자기완결·저장소 밖 임시파일·사용자 HOME 무접촉).
      - name: H-SECRET-1 — 시크릿 스캐너 계측 타당성 (발행 차단)
        shell: bash
        run: |
          set -euo pipefail
          R="cysjavis-pack/bin/tests/run_bootstrap_health.py"
          [ -f "$R" ] || { echo "::error::건강성 러너 누락: $R — 스캐너 계측 타당성 판정 불가(fail-closed)"; exit 1; }
          python3 "$R" --only H-SECRET-1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable
        with:
          toolchain: stable  # SHA 핀이면 ref 이름으로 판을 못 고른다 — 명시

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: pack-release

      - name: Scan pack content (pre-build hard-gate)
        run: bash scripts/scan-pack-secrets.sh

      # ★★배송 팩 계약 게이트(C-1 세 번째 레인 교정 · 2026-07-26) — **이 레인도 pack.tar.gz 를 만들고
      #   pack-manifest.json 을 minisign 서명한다**(아래 `Identity gate + build pack.tar.gz` ·
      #   `Sign pack-manifest.json (minisign)`). 즉 사용자에게 배달되는 Python 선언 파서 본체가
      #   **파리티 검증 0회로 봉인되는 문**이 여기 열려 있었다.
      #   경위: C-1 을 release.yml 의 `pack-artifacts` 잡에만 걸고 닫았다고 판단했으나, 팩-only
      #   레인(pack-v* 태그)은 그 잡을 전혀 타지 않는다. S26(min_binary 하한을 release.yml 에만
      #   고치고 이 파일은 방치)과 **정확히 같은 형태의 레인 비대칭**이다 — 한 문을 닫고 "닫혔다"고
      #   적는 동안 다른 문이 열려 있었다. 그래서 이 게이트는 release.yml `pack-artifacts` 의
      #   동일 블록을 **축소 없이** 옮긴 것이다.
      # 위치: manifest emit(`Emit authoritative pack-manifest.json`)·tar 생성·minisign 서명
      #   **전부보다 앞**. 서명 뒤 검증은 이미 봉인된 것을 보는 일이라 의미가 없다.
      # 러너: ubuntu-latest. 위 `Setup Rust`(dtolnay stable)가 rustc 를 PATH 에 올려두므로 2언어
      #   파리티를 **여기서도 온전히** 돌린다(파이썬 단독 축소본 아님). 하네스는 rustc 부재 시
      #   hard fail 하고, 아래 `command -v rustc` 존재-단언이 그 앞에서 한 번 더 차단한다.
      # 존재-단언은 이 리포 관례(`[ -f "$f" ] || exit 1`)를 그대로 따른다 — untracked 누락으로
      #   게이트가 조용히 skip 되면 초록이 거짓말이 된다.
      - name: 배송 팩 계약 게이트 (선언 파서 2언어 파리티 + 유령집계 회귀)
        shell: bash
        run: |
          set -euo pipefail
          # ★v116-flake-pty ⑶: 팩 임시 폴더를 한 루트 아래 모으고 스텝이 어떻게 끝나든 지운다.
          #   macOS `mktemp -d`(템플릿 없음)는 TMPDIR 를 무시하고 사용자 임시 폴더에 tmp.* 를 남긴다 —
          #   로컬 gate_runner 재실행마다 잔재가 쌓였다. trap 은 실패하지 않는다(set -e 아래 rm 실패가
          #   초록 스텝을 붉히지 않게 · 정리 실패는 경고 1줄).
          CYS_TMP="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/cys-pack.XXXXXX")"
          trap 'rm -rf "${CYS_TMP:?}" 2>/dev/null || { chmod -R u+w "${CYS_TMP:?}" 2>/dev/null; rm -rf "${CYS_TMP:?}" || echo "::warning::임시 팩 폴더 정리 실패: ${CYS_TMP}"; }' EXIT
          d="cysjavis-pack/bin/tests/fixtures/todo-decl"
          h="cysjavis-pack/bin/tests/parity_todo_decl.py"
          [ -d "$d" ] || { echo "골든 픽스처 디렉터리 누락: $d (계약 SOT 부재 = 실패)" >&2; exit 1; }
          [ -f "$d/expected.json" ] || { echo "계약 대장 누락: $d/expected.json (git add 누락 의심)" >&2; exit 1; }
          n="$(find "$d" -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')"
          [ "$n" -ge 15 ] || { echo "픽스처 케이스 부족(${n}종 · 설계 P3-1 최소 15종)" >&2; exit 1; }
          [ -f "$h" ] || { echo "파리티 하네스 누락: $h (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_decl_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_decl_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_decl.rs" ] || { echo "Rust 파서 누락: src/todo_decl.rs (git add 누락 의심)" >&2; exit 1; }
          command -v rustc >/dev/null || { echo "rustc 부재 — 2언어 파리티 불가(축소 실행 금지)" >&2; exit 1; }
