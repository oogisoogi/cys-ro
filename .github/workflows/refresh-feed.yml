# refresh-feed — 자동 갱신 봉투(F) 재서명·게시(1.1.8 U3 · 설계 AUTO-UPDATE-118 §4-1 F 행 · §4-2 feed_rev · §6-1 봉투 표)
#
# 하는 일: 사이트에 게시된 봉투(`https://jarvis.godmeyou.kr/update/<component>/<channel>.json`)를 받아
#   feed_rev +1 · signed_at = 지금 · expires_at = 지금 + 14일로 **다시 만들고**(본문 = U 서명 원문 그대로 · F 는 내용을
#   바꿀 수 없다) F 키로 서명 → U1 `cys update-verify` 로 검증 → (게시 스위치가 켜졌을 때만) 사이트에 게시.
#   · 주 1회(cron) = 만료 연장만(rollout_pct·halt 는 이어받음) · 발행 때(workflow_dispatch + release_seq) = 새 본문을
#     불변 보관소(`/update/<c>/releases/<seq>.json`)에서 받아 싣는다 · 단계 배포·비상 정지 = dispatch 의 rollout_pct·halt.
#
# fail-safe(설계 「실패 = 이전 봉투 유지」): 게시 전 어느 단계든 실패하면 사이트는 그대로다(아무것도 안 올림) · 잡 실패 =
#   GitHub 실패 알림 = 신호. 게시 순서 = **배포 먼저 → 사이트 저장소 push 나중**: 배포가 실패하면 push 0(저장소·라이브 둘 다
#   옛 봉투) · 배포 뒤 push 가 실패해도 다음 회차는 라이브 봉투를 직전으로 삼으므로 feed_rev 가 꼬이지 않는다.
#   봉투가 7일 넘게 갱신되지 않으면 기기 쪽 daily 칸이 잡는다(§4-6 「재생·동결」).
#
# ⛔ 이 워크플로는 기본적으로 **아무것도 게시하지 않는다**: 게시 = dispatch 의 publish=true, 또는 cron 이면 저장소 변수
#   `UPDATE_FEED_PUBLISH` = 'on'. 첫 게시(봉투·폐기문·보관소)·스위치 켜기 = master 집행(비가역 · HANDOFF-U3 §1).
#
# 비밀(이름만 · 값 = master 가 GitHub 설정에 넣는다 — 이 파일·저장소에 값 0):
#   CYS_FEED_SIGNING_PRIVATE_KEY · CYS_FEED_SIGNING_PRIVATE_KEY_PASSWORD  F 키(tauri signer 키 파일 전문 · 팩 키와 같은 형식)
#   AI_JARVIS_PUSH_TOKEN                                                  사이트 원본 저장소(oogisoogi/ai-jarvis) 쓰기
#   CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID                          사이트 워커(jarvis-site) 배포
# 변수: CYS_FEED_KEY_ID(F key id · 키링 purpose=feed 에 있어야 함) · UPDATE_FEED_PUBLISH('on' = cron 게시)
name: refresh-feed

on:
  schedule:
    - cron: '17 0 * * 1'   # 매주 월 00:17 UTC(09:17 KST) — 14일 유효창의 절반 주기
  workflow_dispatch:
    inputs:
      component:
        description: 부품
        type: choice
        options: [cysr, agora-client]
        default: cysr
      channel:
        description: 채널
        type: choice
        options: [stable, next]
        default: next
      release_seq:
        description: '새로 실을 릴리스 seq(빈 값 = 지금 봉투의 본문 그대로 · 만료만 연장)'
        required: false
        default: ''
      rollout_pct:
        description: '단계 배포 비율 0~100(빈 값 = 이어받음 · 첫 봉투는 필수)'
        required: false
        default: ''
      halt:
        description: '비상 정지(빈 값 = 이어받음)'
        type: choice
        options: ['', 'true', 'false']
        default: ''
      first:
        description: '이 (component, channel) 의 첫 봉투(게시된 봉투 없음 · feed_rev 1) — master 첫 게시 때만'
        type: boolean
        default: false
      publish:
        description: '게시(false = 만들고 검증만 · 아티팩트로 남김)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-feed   # 모든 봉투가 같은 사이트를 배포한다 — 한 번에 하나
  cancel-in-progress: false

env:
  TAURI_CLI_VERSION: '2.11.4'
  SITE: https://jarvis.godmeyou.kr

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # cron = 네 봉투 전부(게시된 것만 · 없으면 그 레그는 「없음」으로 끝) · dispatch = 고른 하나(나머지 레그는 건너뜀)
        target:
          - { component: cysr, channel: stable }
          - { component: cysr, channel: next }
          - { component: agora-client, channel: stable }
          - { component: agora-client, channel: next }
    env:
      C: ${{ matrix.target.component }}
      CH: ${{ matrix.target.channel }}
    steps:
      - name: Select leg
        id: leg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$C" = "${{ inputs.component }}" ] && [ "$CH" = "${{ inputs.channel }}" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.leg.outputs.run == '1'

      - name: Fetch current envelope · revocations · release body
        if: steps.leg.outputs.run == '1'
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed && cd feed
          get() { curl -fsS --proto '=https' --max-redirs 0 -o "$2" "$SITE$1"; }
          FIRST="${{ github.event_name == 'workflow_dispatch' && inputs.first || false }}"
          if get "/update/$C/$CH.json" cur.json && get "/update/$C/$CH.json.minisig" cur.json.minisig; then
            [ "$FIRST" != "true" ] || { echo "::error::first=true 인데 $C/$CH 봉투가 이미 게시돼 있다"; exit 1; }
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            if [ "$FIRST" != "true" ]; then
              echo "::notice::$C/$CH 게시된 봉투 없음 — 이 레그는 할 일 없음(첫 게시 = master · first=true)"
              echo "have=0" >> "$GITHUB_OUTPUT"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi
          get /update/revocations.json rev.json
          get /update/revocations.json.minisig rev.json.minisig
          SEQ="${{ github.event_name == 'workflow_dispatch' && inputs.release_seq || '' }}"
          if [ -n "$SEQ" ]; then
            [[ "$SEQ" =~ ^[0-9]+$ ]] || { echo "::error::release_seq 정수 아님"; exit 1; }
            get "/update/$C/releases/$SEQ.json" body.json
            get "/update/$C/releases/$SEQ.json.minisig" body.json.minisig
          else
            [ -f cur.json ] || { echo "::error::첫 봉투는 release_seq 가 필요하다"; exit 1; }
            python3 -c 'import base64,json; e=json.load(open("cur.json")); open("body.json","wb").write(base64.b64decode(e["release"])); open("body.json.minisig","wb").write(base64.b64decode(e["release_sig"]))'
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Build envelope (unsigned)
        if: steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0'
        shell: bash
        env:
          F_KEY_ID: ${{ vars.CYS_FEED_KEY_ID }}
          IN_ROLLOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_pct || '' }}
          IN_HALT: ${{ github.event_name == 'workflow_dispatch' && inputs.halt || '' }}
        run: |
          set -euo pipefail
          test -n "${F_KEY_ID:-}" || { echo "::error::변수 CYS_FEED_KEY_ID 미설정"; exit 1; }
          python3 - "$F_KEY_ID" <<'PY'
          import sys; sys.path.insert(0, "scripts/update")
          import update_common as uc
          uc.find_key(uc.load_keyring("cysjavis-pack/trusted-keys.json"), "feed", sys.argv[1])
          print("F key %s ∈ 내장 키링 feed" % sys.argv[1])
          PY
          args=(--component "$C" --channel "$CH" --release-body feed/body.json --release-sig feed/body.json.minisig
                --key-id "$F_KEY_ID" --out feed/env.json)
          if [ "${{ steps.fetch.outputs.have }}" = "1" ]; then args+=(--prev-envelope feed/cur.json); else args+=(--first); fi
          [ -z "$IN_ROLLOUT" ] || args+=(--rollout-pct "$IN_ROLLOUT")
          [ -z "$IN_HALT" ] || args+=(--halt "$IN_HALT")
          python3 scripts/update/make-envelope.py "${args[@]}"

      - uses: oven-sh/setup-bun@v2
        if: steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0'

      - name: Sign envelope (F · tauri signer → minisign text)
        if: steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0'
        shell: bash
        env:
          CYS_FEED_SIGNING_PRIVATE_KEY: ${{ secrets.CYS_FEED_SIGNING_PRIVATE_KEY }}
          CYS_FEED_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.CYS_FEED_SIGNING_PRIVATE_KEY_PASSWORD }}
          F_KEY_ID: ${{ vars.CYS_FEED_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "${CYS_FEED_SIGNING_PRIVATE_KEY:-}" || { echo "::error::CYS_FEED_SIGNING_PRIVATE_KEY 미설정 — 봉투 서명 불가(이전 봉투 유지)"; exit 1; }
          bunx "@tauri-apps/cli@${TAURI_CLI_VERSION}" signer sign \
            --private-key "$CYS_FEED_SIGNING_PRIVATE_KEY" \
            --password "${CYS_FEED_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
            feed/env.json
          base64 --decode feed/env.json.sig > feed/env.json.minisig
          rm -f feed/env.json.sig
          python3 -c 'import sys; sys.path.insert(0,"scripts/update"); import update_common as uc; k=uc.sig_key_id(open("feed/env.json.minisig").read()); assert k==sys.argv[1], (k, sys.argv[1]); print("서명 key id =", k)' "$F_KEY_ID"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0'
      - uses: swatinem/rust-cache@v2
        if: steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0'

      - name: Verify with the one verifier (cys update-verify · 내장 키링 출시 빌드)
        if: steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin cys
          # 기기는 아무 판에서나 이 봉투를 본다 — installed 0 기준으로 서명·서식·URL 전부 통과해야 한다.
          #   halt=true 또는 rollout<100 이면 판정이 halt/not_in_rollout 인 것이 정상(거부·판정 불가만 실패).
          python3 scripts/update/release-gate.py verify --cys target/release/cys \
            --component "$C" --channel "$CH" --envelope feed/env.json --sig feed/env.json.minisig \
            --revocations feed/rev.json --revocations-sig feed/rev.json.minisig \
            --installed-release-seq 0 --expect apply,halt,not_in_rollout

      - name: Keep the signed envelope as an artifact
        if: steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0'
        uses: actions/upload-artifact@v4
        with:
          name: envelope-${{ matrix.target.component }}-${{ matrix.target.channel }}
          path: |
            feed/env.json
            feed/env.json.minisig

      - name: Publish (deploy first · push after) — switch-gated
        if: >-
          steps.leg.outputs.run == '1' && steps.fetch.outputs.skip == '0' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
           (github.event_name == 'schedule' && vars.UPDATE_FEED_PUBLISH == 'on'))
        shell: bash
        env:
          AI_JARVIS_PUSH_TOKEN: ${{ secrets.AI_JARVIS_PUSH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${AI_JARVIS_PUSH_TOKEN:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}" \
            || { echo "::error::게시 비밀 미설정 — 게시 0(이전 봉투 유지)"; exit 1; }
          git clone --depth 1 "https://x-access-token:${AI_JARVIS_PUSH_TOKEN}@github.com/oogisoogi/ai-jarvis.git" site-repo
          python3 scripts/update/publish-site.py envelope --site-dir site-repo/site --file feed/env.json
          ( cd site-repo && bash web/build-web.sh >/dev/null && cd web && bunx wrangler@3 deploy )
          # 라이브 대조(배포 반영 대기 최대 60초) — 다르면 실패 = 신호(저장소 push 0).
          want="$(sha256sum feed/env.json | cut -d' ' -f1)"
          for i in 1 2 3 4 5 6; do
            got="$(curl -fsS "$SITE/update/$C/$CH.json" | sha256sum | cut -d' ' -f1 || true)"
            [ "$got" = "$want" ] && break
            sleep 10
          done
          [ "$got" = "$want" ] || { echo "::error::라이브 봉투 sha256 불일치(배포 반영 안 됨) — 저장소 push 0"; exit 1; }
          cd site-repo
          git config user.name "refresh-feed[bot]"
          git config user.email "refresh-feed@users.noreply.github.com"
          git add "site/update/$C/$CH.json" "site/update/$C/$CH.json.minisig"
          git commit -q -m "update feed: $C/$CH feed_rev $(python3 -c 'import json; print(json.load(open("../feed/env.json"))["feed_rev"])')"
          git push -q origin HEAD
          echo "✅ 게시 — $C/$CH · sha256 $want"
