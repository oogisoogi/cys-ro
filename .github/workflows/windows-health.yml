# ⚠임시 프로브(TICKET=cysr-118-counsel-race · fix/counsel-race-118 전용 · 병합 전 기반 원문으로 되돌림 — diff 0 확인)
name: windows-health (H-WIN 실기)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  win-health:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: 프로브 ① 부하(CPU 4) · 기본 상한(2초) 30판 — 누락 = 버린 쓰기(반환 0) / 쓴 뒤 사라짐(반환 1)
        shell: bash
        run: |
          set -uo pipefail
          for b in 1 2 3 4; do python -c "while True: pass" & done; sleep 2
          t="$(cygpath -m "$(mktemp -d)")"; mkdir -p "$t/home" "$t/la"
          (cd scripts/tmp && HOME="$t/home" USERPROFILE="$t/home" LOCALAPPDATA="$t/la" PYTHONDONTWRITEBYTECODE=1 python counsel_race_probe.py 30 default "$GITHUB_WORKSPACE/dump/default" 2>&1 | tr -d '\r')
          kill $(jobs -p) 2>/dev/null || true
      - name: 프로브 ② 부하(CPU 4) · 실 시험 30회(CrossLockRace 그대로)
        shell: bash
        run: |
          set -uo pipefail
          for b in 1 2 3 4; do python -c "while True: pass" & done; sleep 2
          red=0
          for i in $(seq 1 30); do
            t="$(cygpath -m "$(mktemp -d)")"; mkdir -p "$t/home" "$t/la" "$t/agora" "$t/state"
            o="$(cd cysjavis-pack/bin/tests && HOME="$t/home" USERPROFILE="$t/home" LOCALAPPDATA="$t/la" AGORA_CONFIG_DIR="$t/agora" CYS_STATE_DIR="$t/state" PYTHONDONTWRITEBYTECODE=1 python -m unittest test_javis_counsel.CrossLockRace 2>&1 | tr -d '\r')" || { red=$((red+1)); echo "== 적색 $i"; echo "$o" | grep -E 'additional elements|First differing|Error' ; }
          done
          echo "REALTEST-SUMMARY runs=30 red=$red"
          kill $(jobs -p) 2>/dev/null || true
      - name: 프로브 ③ 부하(CPU 4) · 상한 60초 30판 — 잠금 규약 자체의 유실 여부
        shell: bash
        run: |
          set -uo pipefail
          for b in 1 2 3 4; do python -c "while True: pass" & done; sleep 2
          t="$(cygpath -m "$(mktemp -d)")"; mkdir -p "$t/home" "$t/la"
          (cd scripts/tmp && HOME="$t/home" USERPROFILE="$t/home" LOCALAPPDATA="$t/la" PYTHONDONTWRITEBYTECODE=1 python counsel_race_probe.py 30 60 "$GITHUB_WORKSPACE/dump/w60" 2>&1 | tr -d '\r')
          kill $(jobs -p) 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: counsel-race-dump
          path: dump
          if-no-files-found: ignore
