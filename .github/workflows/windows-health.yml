# ⚠임시 프로브(TICKET=cysr-118-counsel-race · fix/counsel-race-118 전용 · 병합 전 기반 원문으로 되돌림 — diff 0 확인)
name: windows-health (H-WIN 실기)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  win-health:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: 검증 ① 부하(CPU 4) · 새 CrossLockRace 30회
        shell: bash
        run: |
          set -uo pipefail
          for b in 1 2 3 4; do python -c "while True: pass" & done; sleep 2
          red=0
          for i in $(seq 1 30); do
            t="$(cygpath -m "$(mktemp -d)")"; mkdir -p "$t/home" "$t/la" "$t/agora" "$t/state"
            o="$(cd cysjavis-pack/bin/tests && HOME="$t/home" USERPROFILE="$t/home" LOCALAPPDATA="$t/la" AGORA_CONFIG_DIR="$t/agora" CYS_STATE_DIR="$t/state" PYTHONDONTWRITEBYTECODE=1 python -m unittest test_javis_counsel.CrossLockRace 2>&1 | tr -d '\r')" || { red=$((red+1)); echo "== 적색 $i"; echo "$o" | tail -8; }
          done
          echo "NEWTEST-LOAD-SUMMARY runs=30 red=$red"
          kill $(jobs -p) 2>/dev/null || true
      - name: 검증 ② 부하(CPU 4) · 뮤턴트(팩 쓰기 잠금 제거) 10회 — 적색이어야 한다
        shell: bash
        run: |
          set -uo pipefail
          sed -i 's|        fh = _acquire(_counsel(cfg, SIGNALS_LOCK), wait_s)|        fh = open(_counsel(cfg, SIGNALS_LOCK), "a+", encoding="utf-8")  # MUTANT|' cysjavis-pack/bin/javis_counsel.py
          grep -c 'MUTANT' cysjavis-pack/bin/javis_counsel.py
          for b in 1 2 3 4; do python -c "while True: pass" & done; sleep 2
          red=0
          for i in $(seq 1 10); do
            t="$(cygpath -m "$(mktemp -d)")"; mkdir -p "$t/home" "$t/la" "$t/agora" "$t/state"
            (cd cysjavis-pack/bin/tests && HOME="$t/home" USERPROFILE="$t/home" LOCALAPPDATA="$t/la" AGORA_CONFIG_DIR="$t/agora" CYS_STATE_DIR="$t/state" PYTHONDONTWRITEBYTECODE=1 python -m unittest test_javis_counsel.CrossLockRace >/dev/null 2>&1) || red=$((red+1))
          done
          echo "MUTANT-LOAD-SUMMARY runs=10 red=$red"
          kill $(jobs -p) 2>/dev/null || true
          git checkout -- cysjavis-pack/bin/javis_counsel.py
      - name: 검증 ③ 상담소 팩 시험 전체 1회(부하 없음)
        shell: bash
        run: |
          set -uo pipefail
          t="$(cygpath -m "$(mktemp -d)")"; mkdir -p "$t/home" "$t/la" "$t/agora" "$t/state"
          (cd cysjavis-pack/bin/tests && HOME="$t/home" USERPROFILE="$t/home" LOCALAPPDATA="$t/la" AGORA_CONFIG_DIR="$t/agora" CYS_STATE_DIR="$t/state" PYTHONDONTWRITEBYTECODE=1 python -m unittest test_javis_counsel 2>&1 | tr -d '\r' | tail -4)
