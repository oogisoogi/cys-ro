[package]
name = "cys-app"
version = "1.1.5"
edition = "2021"
description = "cys UI shell (Tauri 2) — thin client over the cysd socket"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time"] }
base64 = "0.22"
sha2 = "0.10"
cys = { package = "cys-terminal", path = ".." }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 맥 앱 내 업데이트(B7 · TICKET=v110-darwin-update) — 받은 zip 의 sha256 검증.
# ★기판 한정 의존으로 두지 않는다: 검증 코드는 모든 기판에서 컴파일·시험돼야 한다(BLOCK-B 규율과 짝).
